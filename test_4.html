<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>GANGSTA GOON: SIGMA STREETZ</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Comic Sans MS', Impact, cursive;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .gangsta-pig {
      position: absolute;
      font-size: 40px;
      z-index: 10;
      transition: transform 0.3s;
    }
    #helicopter {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 100px;
      z-index: 100;
      transition: all 0.2s;
    }
    #chat {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 350px;
      height: 180px;
      background: rgba(0,0,0,0.85);
      border: 3px solid #ff00ff;
      color: #00ff00;
      padding: 10px;
      font-family: monospace;
      overflow-y: auto;
      pointer-events: auto;
    }
    .chat-msg {
      margin: 4px 0;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #sigmaPanel {
      position: absolute;
      top: 20px;
      right: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 250px;
      pointer-events: auto;
    }
    .sigma-btn {
      padding: 8px;
      font-size: 14px;
      background: linear-gradient(90deg, #ff00ff, #00ffff);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Comic Sans MS';
    }
    .sigma-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #ff00ff;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      text-shadow: 0 0 8px black;
    }
    #gigachadText {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 70px;
      color: gold;
      text-shadow: 0 0 30px gold;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
    }
    #smoke {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div id="helicopter">🚁</div>
    <div id="hud">
      <div>Режим: <span id="mode">Gangsta</span></div>
      <div>Свиней: <span id="pigCount">10</span></div>
      <div>Хасанов: <span id="hassanCount">0</span></div>
    </div>

    <div id="chat">
      <div class="chat-msg">[Gangsta_AI]: yo nub, u got no drip 💯</div>
    </div>

    <div id="sigmaPanel">
      <button class="sigma-btn" onclick="setMode('gangsta')">Gangsta</button>
      <button class="sigma-btn" onclick="setMode('hacker')">Hacker</button>
      <button class="sigma-btn" onclick="setMode('sigma')">Sigma</button>
      <button class="sigma-btn" onclick="flex()">Flex 💪</button>
      <button class="sigma-btn" onclick="grindset()">Grindset</button>
      <button class="sigma-btn" onclick="noTalk()">No Talk</button>
      <button class="sigma-btn" onclick="dropTrack()">Drop Track</button>
      <button class="sigma-btn" onclick="activateGigachad()">GIGACHAD</button>
      <button class="sigma-btn" onclick="hackCity()">Hack City</button>
      <button class="sigma-btn" onclick="summonPigs()">+ Свиньи</button>
    </div>

    <div id="gigachadText">GIGACHAD MODE ACTIVATED</div>
    <div id="smoke"></div>
  </div>

  <script>
    // === ГЛОБАЛЫ ===
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let helicopter = { x: 0, y: 0, isFlying: true };
    let pigs = [];
    let buildings = [];
    let mode = 'gangsta';
    let hassanCount = 0;
    let keys = {};
    let chatMessages = [
      "bruh ur so nub",
      "skrrt skrrt 💯",
      "u got no sigma energy",
      "go touch grass fr",
      "lmao get rekt",
      "ur mom loves my drip",
      "hassan on u fr",
      "1337 > u"
    ];

    // === ИНИЦИАЛИЗАЦИЯ ===
    function init() {
      resize();
      window.addEventListener('resize', resize);
      spawnBuildings();
      spawnPigs();
      startChatSpam();
      gameLoop();
      
      // Управление
      document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
      document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
      canvas.addEventListener('click', handleCanvasClick);
    }

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      helicopter.x = width / 2;
      helicopter.y = height / 2;
    }

    // === МИР ===
    function spawnBuildings() {
      buildings = [];
      for (let i = 0; i < 20; i++) {
        buildings.push({
          x: Math.random() * width,
          y: height - 100 - Math.random() * 300,
          width: 80 + Math.random() * 100,
          height: 100 + Math.random() * 400,
          color: `hsl(${Math.random() * 360}, 70%, 30%)`
        });
      }
    }

    function drawWorld() {
      // Фон
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#1a1a2e');
      gradient.addColorStop(1, '#16213e');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      // Здания
      buildings.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        
        // Окна
        ctx.fillStyle = '#ffcc00';
        for (let i = 0; i < 5; i++) {
          for (let j = 0; j < 3; j++) {
            if (Math.random() > 0.3) {
              ctx.fillRect(b.x + 10 + i*15, b.y + 20 + j*20, 8, 12);
            }
          }
        }
      });

      // Дорога
      ctx.fillStyle = '#222';
      ctx.fillRect(0, height - 50, width, 50);
      ctx.setLineDash([20, 20]);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, height - 25);
      ctx.lineTo(width, height - 25);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // === СВИНЬИ-ГЭНГСТА ===
    function spawnPigs(count = 10) {
      for (let i = 0; i < count; i++) {
        pigs.push({
          x: Math.random() * width,
          y: height - 80,
          dx: (Math.random() - 0.5) * 2,
          icon: '🐷',
          color: '#ff6b6b',
          isHacked: false,
          lastAction: 0
        });
      }
      updateHUD();
    }

    function updatePigs() {
      pigs.forEach(pig => {
        if (pig.isHacked) return;
        
        pig.x += pig.dx;
        if (pig.x < 0 || pig.x > width) pig.dx *= -1;
        
        // Анимация курения (раз в 3 сек)
        if (Date.now() - pig.lastAction > 3000 && Math.random() < 0.1) {
          pig.lastAction = Date.now();
          createSmoke(pig.x, pig.y - 20);
        }
      });
    }

    function drawPigs() {
      pigs.forEach(pig => {
        ctx.save();
        ctx.translate(pig.x, pig.y);
        ctx.font = '40px Arial';
        ctx.fillStyle = pig.isHacked ? '#00ff00' : pig.color;
        ctx.fillText(pig.icon, -20, 10);
        ctx.restore();
      });
    }

    // === ВЕРТОЛЁТ ===
    function updateHelicopter() {
      if (!helicopter.isFlying) return;
      
      // Управление WASD
      if (keys['w'] || keys['arrowup']) helicopter.y -= 5;
      if (keys['s'] || keys['arrowdown']) helicopter.y += 5;
      if (keys['a'] || keys['arrowleft']) helicopter.x -= 5;
      if (keys['d'] || keys['arrowright']) helicopter.x += 5;

      // Границы
      helicopter.x = Math.max(50, Math.min(width - 50, helicopter.x));
      helicopter.y = Math.max(50, Math.min(height - 100, helicopter.y));
    }

    function drawHelicopter() {
      ctx.save();
      ctx.translate(helicopter.x, helicopter.y);
      ctx.font = '100px Arial';
      ctx.fillText('🚁', -50, 30);
      ctx.restore();
    }

    // === ЭФФЕКТЫ ===
    function createSmoke(x, y) {
      const smoke = document.getElementById('smoke');
      const puff = document.createElement('div');
      puff.style.position = 'absolute';
      puff.style.left = x + 'px';
      puff.style.top = y + 'px';
      puff.style.width = '20px';
      puff.style.height = '20px';
      puff.style.backgroundColor = 'rgba(200,200,200,0.7)';
      puff.style.borderRadius = '50%';
      puff.style.pointerEvents = 'none';
      smoke.appendChild(puff);
      
      // Анимация
      let opacity = 0.7;
      const interval = setInterval(() => {
        opacity -= 0.05;
        puff.style.opacity = opacity;
        puff.style.transform = `translateY(-${20 - opacity*200}px)`;
        if (opacity <= 0) {
          clearInterval(interval);
          smoke.removeChild(puff);
        }
      }, 50);
    }

    // === УПРАВЛЕНИЕ ===
    function handleCanvasClick(e) {
      if (!helicopter.isFlying) return;
      
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      
      // Приказать ближайшей свинье
      let closest = null;
      let minDist = 100;
      pigs.forEach(pig => {
        const dx = pig.x - clickX;
        const dy = pig.y - clickY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < minDist) {
          minDist = dist;
          closest = pig;
        }
      });
      
      if (closest) {
        if (mode === 'gangsta') {
          closest.icon = '🔫';
          setTimeout(() => closest.icon = '🐷', 1000);
          addChatMessage("[ТЫ]: Стреляй, брат!");
        } else if (mode === 'hacker') {
          closest.isHacked = true;
          closest.icon = '🐸';
          addChatMessage("[ТЫ]: Взломал этого нуба!");
        } else if (mode === 'sigma') {
          closest.icon = '🙇';
          setTimeout(() => closest.icon = '🐷', 2000);
          addChatMessage("[ТЫ]: Поклонись, нуб!");
        }
      }
    }

    // === SIGMA ФУНКЦИИ ===
    function setMode(newMode) {
      mode = newMode;
      document.getElementById('mode').textContent = newMode.charAt(0).toUpperCase() + newMode.slice(1);
      addChatMessage(`[ТЫ]: Режим ${newMode} активирован!`);
    }

    function flex() {
      addChatMessage("[ТЫ]: 💪 FLEXING ON NUBS 💪");
      createSmoke(helicopter.x, helicopter.y - 50);
    }

    function grindset() {
      addChatMessage("[ТЫ]: GRINDSET ACTIVATED — NO SLEEP TILL VICTORY");
    }

    function noTalk() {
      addChatMessage("[ТЫ]: NO TALK, ONLY SIGMA");
      // Все свиньи замолкают на 5 сек
      pigs.forEach(pig => pig.lastAction = Date.now() + 5000);
    }

    function dropTrack() {
      addChatMessage("[ТЫ]: DROP THE BEAT, NUBS! 💿");
      helicopter.isFlying = false;
      setTimeout(() => helicopter.isFlying = true, 2000);
    }

    function hackCity() {
      addChatMessage("[ТЫ]: HACKING CITY INFRASTRUCTURE...");
      setTimeout(() => {
        addChatMessage("ГОГОРОД ВЗЛОМАН! ВСЕ БАНКОМАТЫ — ТВОИ!");
        pigs.forEach(pig => {
          if (!pig.isHacked) {
            pig.isHacked = true;
            pig.icon = '💰';
          }
        });
      }, 2000);
    }

    function summonPigs() {
      spawnPigs(5);
      addChatMessage("[ТЫ]: ПРИЗЫВАЮ ЕЩЁ СВИНЕЙ-ГЭНГСТА!");
    }

    function activateGigachad() {
      const text = document.getElementById('gigachadText');
      text.style.opacity = '1';
      text.style.animation = 'pulse 0.5s infinite';
      addChatMessage("GIGACHAD MODE: АКТИВИРОВАН!");
      
      setTimeout(() => {
        text.style.opacity = '0';
        // Все свиньи становятся золотыми
        pigs.forEach(pig => {
          pig.color = '#ffd700';
        });
        setTimeout(() => {
          pigs.forEach(pig => {
            if (!pig.isHacked) pig.color = '#ff6b6b';
          });
        }, 3000);
      }, 5000);
    }

    // === ЧАТ ===
    function startChatSpam() {
      setInterval(() => {
        const troll = ["Gangsta_AI", "SigmaDed", "GogoMaster", "L33tH4x0r"][Math.floor(Math.random() * 4)];
        const msg = chatMessages[Math.floor(Math.random() * chatMessages.length)];
        addChatMessage(`[${troll}]: ${msg}`);
      }, 2500);
    }

    function addChatMessage(msg) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.textContent = msg;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      hassanCount++;
      document.getElementById('hassanCount').textContent = hassanCount;
    }

    function updateHUD() {
      document.getElementById('pigCount').textContent = pigs.length;
    }

    // === ОСНОВНОЙ ЦИКЛ ===
    function gameLoop() {
      ctx.clearRect(0, 0, width, height);
      
      drawWorld();
      updatePigs();
      drawPigs();
      updateHelicopter();
      drawHelicopter();
      
      requestAnimationFrame(gameLoop);
    }

    // === ЗАПУСК ===
    window.onload = () => {
      setTimeout(() => {
        init();
        addChatMessage("Добро пожаловать в SIGMA STREETZ, босс.");
        addChatMessage("Ты — легенда улиц. Твои свиньи — твоя армия.");
      }, 1000);
    };

    // === ЗАЩИТА ОТ НУБОВ ===
    window.addEventListener('beforeunload', () => {
      alert("Ты не можешь выйти, босс! Улицы нуждаются в тебе!");
    });
  </script>
</body>
</html>
