<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>SIGMA GOON: MEGACITY EDITION</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Comic Sans MS', Impact, cursive;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #sigmaGoon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px;
      z-index: 100;
      transition: transform 0.2s;
    }
    .nub {
      position: absolute;
      font-size: 30px;
      z-index: 10;
      transition: transform 0.3s;
    }
    #chat {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 350px;
      height: 180px;
      background: rgba(0,0,0,0.85);
      border: 3px solid #ff00ff;
      color: #00ff00;
      padding: 10px;
      font-family: monospace;
      overflow-y: auto;
      pointer-events: auto;
    }
    .chat-msg {
      margin: 4px 0;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #flexPanel {
      position: absolute;
      top: 20px;
      right: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 300px;
      pointer-events: auto;
    }
    .flex-btn {
      padding: 8px;
      font-size: 12px;
      background: linear-gradient(90deg, #ff00ff, #00ffff);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Comic Sans MS';
    }
    .flex-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #ff00ff;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      text-shadow: 0 0 8px black;
    }
    #gigachadText {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 70px;
      color: gold;
      text-shadow: 0 0 30px gold;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
    }
    #smoke {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
    }
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ff6ec7;
      z-index: 1000;
    }
    .logo {
      font-size: 60px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ff6ec7, #6e6cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">SIGMA GOON</div>
    <div>Генерация мегаполиса...</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div id="sigmaGoon">😎💪</div>
    <div id="hud">
      <div>Режим: <span id="mode">Flex</span></div>
      <div>Нубов: <span id="nubCount">50</span></div>
      <div>Флекса: <span id="flexCount">0</span></div>
    </div>

    <div id="chat">
      <div class="chat-msg">[AI_Troll]: yo nub, u got no drip 💯</div>
    </div>

    <div id="flexPanel">
      <button class="flex-btn" onclick="setMode('gangsta')">Gangsta</button>
      <button class="flex-btn" onclick="setMode('hacker')">Hacker</button>
      <button class="flex-btn" onclick="setMode('sigma')">Sigma</button>
      <button class="flex-btn" onclick="flex()">Flex 💪</button>
      <button class="flex-btn" onclick="grindset()">Grindset</button>
      <button class="flex-btn" onclick="noTalk()">No Talk</button>
      <button class="flex-btn" onclick="dropTrack()">Drop Track</button>
      <button class="flex-btn" onclick="activateGigachad()">GIGACHAD</button>
      <button class="flex-btn" onclick="hackCity()">Hack City</button>
      <button class="flex-btn" onclick="summonNubs()">+ Нубы</button>
      <button class="flex-btn" onclick="goldRain()">Gold Rain</button>
      <button class="flex-btn" onclick="sigmaAura()">Sigma Aura</button>
      <button class="flex-btn" onclick="trollAll()">Troll All</button>
      <button class="flex-btn" onclick="realGoon()">Real Goon</button>
      <button class="flex-btn" onclick="exitGame()">Exit</button>
    </div>

    <div id="gigachadText">GIGACHAD MODE ACTIVATED</div>
    <div id="smoke"></div>
  </div>

  <script>
    // === ГЛОБАЛЫ ===
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let goon = { x: 0, y: 0 };
    let nubs = [];
    let buildings = [];
    let roads = [];
    let mode = 'flex';
    let flexCount = 0;
    let keys = {};
    let camera = { x: 0, y: 0, zoom: 1 };
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };
    let chatMessages = [
      "bruh ur so nub",
      "skrrt skrrt 💯",
      "u got no sigma energy",
      "go touch grass fr",
      "lmao get rekt",
      "ur mom loves my drip",
      "hassan on u fr",
      "1337 > u",
      "noob detected",
      "sigma grindset activated"
    ];

    // === ИНИЦИАЛИЗАЦИЯ ===
    function init() {
      resize();
      window.addEventListener('resize', resize);
      
      // Управление мышью
      canvas.addEventListener('mousedown', handleMouseDown);
      canvas.addEventListener('mousemove', handleMouseMove);
      canvas.addEventListener('mouseup', handleMouseUp);
      canvas.addEventListener('wheel', handleWheel);
      
      // Управление клавиатурой
      document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
      document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
      
      generateCity();
      spawnNubs();
      startChatSpam();
      gameLoop();
      
      // Скрыть загрузку
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        addChatMessage("Добро пожаловать в SIGMA MEGACITY, босс.");
        addChatMessage("Ты — легенда. Ты — GOON. Ты — SIGMA.");
      }, 2000);
    }

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      goon.x = width / 2;
      goon.y = height / 2;
    }

    // === ГЕНЕРАЦИЯ МЕГАПОЛИСА ===
    function generateCity() {
      buildings = [];
      roads = [];
      
      // Дороги
      for (let i = 0; i < 20; i++) {
        if (i % 2 === 0) {
          // Горизонтальные
          roads.push({ x: 0, y: i * 100, width: width, height: 20, type: 'h' });
        } else {
          // Вертикальные
          roads.push({ x: i * 150, y: 0, width: 20, height: height, type: 'v' });
        }
      }
      
      // Здания
      for (let i = 0; i < 200; i++) {
        const size = 30 + Math.random() * 70;
        const x = Math.random() * width;
        const y = Math.random() * height;
        
        // Не ставить на дорогах
        let onRoad = false;
        roads.forEach(road => {
          if (x > road.x && x < road.x + road.width &&
              y > road.y && y < road.y + road.height) {
            onRoad = true;
          }
        });
        
        if (!onRoad) {
          buildings.push({
            x: x,
            y: y,
            width: size,
            height: size + Math.random() * 100,
            color: `hsl(${Math.random() * 360}, 70%, ${30 + Math.random() * 20}%)`
          });
        }
      }
    }

    function drawCity() {
      // Фон
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, width, height);
      
      // Дороги
      ctx.fillStyle = '#222';
      roads.forEach(road => {
        ctx.fillRect(road.x, road.y, road.width, road.height);
      });
      
      // Разметка
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 10]);
      roads.forEach(road => {
        if (road.type === 'h') {
          ctx.beginPath();
          ctx.moveTo(road.x, road.y + 10);
          ctx.lineTo(road.x + road.width, road.y + 10);
          ctx.stroke();
        }
      });
      ctx.setLineDash([]);
      
      // Здания
      buildings.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        
        // Окна
        ctx.fillStyle = '#ffcc00';
        const winCountX = Math.floor(b.width / 15);
        const winCountY = Math.floor(b.height / 20);
        for (let i = 0; i < winCountX; i++) {
          for (let j = 0; j < winCountY; j++) {
            if (Math.random() > 0.4) {
              ctx.fillRect(
                b.x + 5 + i*12, 
                b.y + 10 + j*18, 
                8, 12
              );
            }
          }
        }
      });
    }

    // === НУБЫ ===
    function spawnNubs(count = 50) {
      for (let i = 0; i < count; i++) {
        nubs.push({
          x: Math.random() * width,
          y: Math.random() * height,
          dx: (Math.random() - 0.5) * 2,
          dy: (Math.random() - 0.5) * 2,
          icon: '🐷',
          color: '#ff6b6b',
          isHacked: false,
          lastAction: 0
        });
      }
      updateHUD();
    }

    function updateNubs() {
      nubs.forEach(nub => {
        if (nub.isHacked) return;
        
        nub.x += nub.dx;
        nub.y += nub.dy;
        
        // Отскок от границ
        if (nub.x < 0 || nub.x > width) nub.dx *= -1;
        if (nub.y < 0 || nub.y > height) nub.dy *= -1;
        
        // Анимация
        if (Date.now() - nub.lastAction > 2000 && Math.random() < 0.05) {
          nub.lastAction = Date.now();
          createSmoke(nub.x, nub.y - 20);
        }
      });
    }

    function drawNubs() {
      nubs.forEach(nub => {
        ctx.save();
        ctx.translate(nub.x, nub.y);
        ctx.font = '30px Arial';
        ctx.fillStyle = nub.isHacked ? '#00ff00' : nub.color;
        ctx.fillText(nub.icon, -15, 10);
        ctx.restore();
      });
    }

    // === УПРАВЛЕНИЕ МЫШЬЮ ===
    function handleMouseDown(e) {
      isDragging = true;
      const rect = canvas.getBoundingClientRect();
      lastMouse.x = e.clientX - rect.left;
      lastMouse.y = e.clientY - rect.top;
    }

    function handleMouseMove(e) {
      if (!isDragging) return;
      
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      
      const deltaX = mouseX - lastMouse.x;
      const deltaY = mouseY - lastMouse.y;
      
      camera.x -= deltaX;
      camera.y -= deltaY;
      
      lastMouse.x = mouseX;
      lastMouse.y = mouseY;
    }

    function handleMouseUp() {
      isDragging = false;
    }

    function handleWheel(e) {
      e.preventDefault();
      camera.zoom += e.deltaY * -0.001;
      camera.zoom = Math.min(Math.max(0.5, camera.zoom), 3);
    }

    // === УПРАВЛЕНИЕ КЛАВИАТУРОЙ ===
    function updateGoon() {
      const speed = 5 / camera.zoom;
      if (keys['w'] || keys['arrowup']) goon.y -= speed;
      if (keys['s'] || keys['arrowdown']) goon.y += speed;
      if (keys['a'] || keys['arrowleft']) goon.x -= speed;
      if (keys['d'] || keys['arrowright']) goon.x += speed;
      
      // Границы
      goon.x = Math.max(0, Math.min(width, goon.x));
      goon.y = Math.max(0, Math.min(height, goon.y));
    }

    // === ЭФФЕКТЫ ===
    function createSmoke(x, y) {
      const smoke = document.getElementById('smoke');
      const puff = document.createElement('div');
      puff.style.position = 'absolute';
      puff.style.left = x + 'px';
      puff.style.top = y + 'px';
      puff.style.width = '15px';
      puff.style.height = '15px';
      puff.style.backgroundColor = 'rgba(200,200,200,0.7)';
      puff.style.borderRadius = '50%';
      puff.style.pointerEvents = 'none';
      smoke.appendChild(puff);
      
      let opacity = 0.7;
      const interval = setInterval(() => {
        opacity -= 0.05;
        puff.style.opacity = opacity;
        puff.style.transform = `translateY(-${15 - opacity*150}px)`;
        if (opacity <= 0) {
          clearInterval(interval);
          smoke.removeChild(puff);
        }
      }, 50);
    }

    function goldRain() {
      addChatMessage("[ТЫ]: GOLD RAIN ACTIVATED! 💰");
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          const x = Math.random() * width;
          const y = -20;
          const coin = document.createElement('div');
          coin.textContent = '💰';
          coin.style.position = 'absolute';
          coin.style.left = x + 'px';
          coin.style.top = y + 'px';
          coin.style.fontSize = '20px';
          coin.style.pointerEvents = 'none';
          document.body.appendChild(coin);
          
          let posY = y;
          const fall = setInterval(() => {
            posY += 5;
            coin.style.top = posY + 'px';
            if (posY > height) {
              clearInterval(fall);
              document.body.removeChild(coin);
            }
          }, 50);
        }, i * 100);
      }
    }

    // === SIGMA ФУНКЦИИ ===
    function setMode(newMode) {
      mode = newMode;
      document.getElementById('mode').textContent = newMode.charAt(0).toUpperCase() + newMode.slice(1);
      addChatMessage(`[ТЫ]: Режим ${newMode} активирован!`);
    }

    function flex() {
      flexCount++;
      addChatMessage("[ТЫ]: 💪 FLEXING ON NUBS 💪");
      document.getElementById('sigmaGoon').style.transform = 'translate(-50%, -50%) scale(1.2)';
      setTimeout(() => {
        document.getElementById('sigmaGoon').style.transform = 'translate(-50%, -50%)';
      }, 300);
      updateHUD();
    }

    function grindset() {
      addChatMessage("[ТЫ]: GRINDSET ACTIVATED — NO SLEEP TILL VICTORY");
    }

    function noTalk() {
      addChatMessage("[ТЫ]: NO TALK, ONLY SIGMA");
    }

    function dropTrack() {
      addChatMessage("[ТЫ]: DROP THE BEAT, NUBS! 💿");
    }

    function hackCity() {
      addChatMessage("[ТЫ]: HACKING CITY INFRASTRUCTURE...");
      setTimeout(() => {
        addChatMessage("ГОГОРОД ВЗЛОМАН! ВСЕ НУБЫ — ТВОИ!");
        nubs.forEach(nub => {
          if (!nub.isHacked) {
            nub.isHacked = true;
            nub.icon = '🐸';
          }
        });
      }, 2000);
    }

    function summonNubs() {
      spawnNubs(20);
      addChatMessage("[ТЫ]: ПРИЗЫВАЮ ЕЩЁ НУБОВ!");
    }

    function activateGigachad() {
      const text = document.getElementById('gigachadText');
      text.style.opacity = '1';
      addChatMessage("GIGACHAD MODE: АКТИВИРОВАН!");
      
      setTimeout(() => {
        text.style.opacity = '0';
      }, 5000);
    }

    function sigmaAura() {
      addChatMessage("[ТЫ]: SIGMA AURA ACTIVATED — ALL NUBS FEAR ME");
      // Все нубы отбегают
      nubs.forEach(nub => {
        const dx = nub.x - goon.x;
        const dy = nub.y - goon.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 200) {
          nub.x += dx * 2;
          nub.y += dy * 2;
        }
      });
    }

    function trollAll() {
      addChatMessage("[ТЫ]: TROLLING ALL NUBS IN THE CITY!");
      nubs.forEach(nub => {
        nub.icon = '🤡';
        setTimeout(() => {
          if (!nub.isHacked) nub.icon = '🐷';
        }, 2000);
      });
    }

    function realGoon() {
      addChatMessage("REAL GOON MODE: YOU ARE THE LEGEND OF THIS CITY");
      document.getElementById('sigmaGoon').innerHTML = '😎💪🔥';
      setTimeout(() => {
        document.getElementById('sigmaGoon').innerHTML = '😎💪';
      }, 3000);
    }

    function exitGame() {
      if (confirm("Ты уверен, босс? Улицы будут скучать...")) {
        alert("Ты всегда можешь вернуться, SIGMA GOON!");
      }
    }

    // === ЧАТ ===
    function startChatSpam() {
      setInterval(() => {
        const troll = ["AI_Troll", "SigmaDed", "GogoMaster", "L33tH4x0r", "NubHunter"][Math.floor(Math.random() * 5)];
        const msg = chatMessages[Math.floor(Math.random() * chatMessages.length)];
        addChatMessage(`[${troll}]: ${msg}`);
      }, 2000);
    }

    function addChatMessage(msg) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.textContent = msg;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function updateHUD() {
      document.getElementById('nubCount').textContent = nubs.length;
      document.getElementById('flexCount').textContent = flexCount;
    }

    // === ОСНОВНОЙ ЦИКЛ ===
    function gameLoop() {
      ctx.clearRect(0, 0, width, height);
      
      drawCity();
      updateNubs();
      drawNubs();
      updateGoon();
      
      // Обновить позицию GOON
      const goonEl = document.getElementById('sigmaGoon');
      goonEl.style.left = goon.x + 'px';
      goonEl.style.top = goon.y + 'px';
      
      requestAnimationFrame(gameLoop);
    }

    // === ЗАПУСК ===
    window.onload = () => {
      init();
    };

    // === ЗАЩИТА ОТ НУБОВ ===
    window.addEventListener('beforeunload', () => {
      alert("Ты не можешь выйти, босс! Мегаполис нуждается в тебе!");
    });
  </script>
</body>
</html>
