# Define the system of units to use internally. 
InternalUnitSystem:
  UnitMass_in_cgs:     1000    # Grams (1 kg)
  UnitLength_in_cgs:   100     # Centimeters (1 m)
  UnitVelocity_in_cgs: 100     # Centimeters per second (1 m/s)
  UnitCurrent_in_cgs:  1       # Amperes
  UnitTemp_in_cgs:     1       # Kelvin

Scheduler:
  max_top_level_cells: 16
  
# Parameters governing the time integration
TimeIntegration:
  time_begin: 0
  time_end:   34560000      # 1 год в секундах
  dt_min:     1e-3
  dt_max:     1000.

# Parameters governing the conserved quantities statistics
Statistics:
  delta_time: 86400.        # Вывод статистики каждый день
  
# Parameters governing the snapshots
Snapshots:
  basename:    ./snapshot   # ← без подпапки output
  time_first:  0.
  delta_time:  86400        # Снапшот каждый день

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2349   # Target smoothing length (48 neighbours for M4 kernel)
  delta_neighbours:      0.1
  CFL_condition:         0.1
  max_ghost_iterations:  30
  h_max:                 1e10      # ← ИСПРАВЛЕНО: ~0.07 AU, меньше толщины диска * 2
  h_tolerance: 0.0001
  h_min_ratio: 0
  use_mass_weighted_num_ngb: 0
  max_volume_change: 1.4
  initial_temperature: 0
  minimal_temperature: 0
  H_ionization_temperature: 10000
  H_mass_fraction: 0.752
  viscosity_alpha: 2
  viscosity_alpha_max: 4
  viscosity_alpha_min: 0
  viscosity_length: 0.05
  diffusion_alpha: 0
  diffusion_beta: 1
  diffusion_alpha_max: 1
  diffusion_alpha_min: 0
  particle_splitting: 0

# Parameters for the self-gravity scheme
Gravity:
  eta:                      0.025
  MAC:                      adaptive
  epsilon_fmm:              0.001
  theta_cr:                 0.7
  mesh_side_length:         128
  # Мягчение гравитации: должно быть ~0.1-0.5 * h_mean
  max_physical_DM_softening:      1e9     # ← ~0.007 AU, для звезды
  max_physical_baryon_softening:  5e9     # ← ~0.03 AU, для газа

# Parameters related to the initial conditions
InitialConditions:
  file_name:  IC.hdf5
  periodic:   1            # Периодичность в симуляции — ОК, но не в расчёте h!